name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read, and nothing else. Without this block a job runs with whatever the
# repository's default happens to be — which for a repository created before
# 2023 is read *and write*, so every step here, and every dependency of every
# step, holds a token that can push to main. None of these jobs write
# anything; the one workflow that does asks for it where it asks.
#
# Jobs that need even less than read say so themselves.
permissions:
  contents: read

# Actions are pinned to a commit rather than to `@v4`, which is a tag and
# therefore a name its owner can point somewhere else at any time. The version
# is in the comment so the next reader knows what they are looking at, and
# dependabot rewrites both together.

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # macOS is here because the releases page has an aarch64-apple-darwin
      # tarball on it. Building a binary for a platform nothing has ever run
      # the tests on is publishing a guess; crossterm is where the two
      # actually differ, and crossterm is most of what the event loop is.
      #
      # No Windows: nothing is built for it and neither program has been
      # designed against it, so a red tick there would be reporting a
      # platform that was never claimed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      # `persist-credentials: false` on every checkout: the default leaves a
      # token in .git/config for the rest of the job, where anything that
      # reads the working tree can read it too. Nothing here pushes.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      # No `rustup toolchain install` step: rust-toolchain.toml names the
      # exact version and the components, and rustup installs it on the first
      # cargo call. Naming a channel here as well would only be a second
      # answer to the same question, free to disagree with the first.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # nextest rather than libtest: one line per test with what it cost, a
      # summary that is the same shape whether one failed or none did, and
      # failures printed at the end rather than interleaved with the runs
      # that passed. It is the runner jj, atuin and gitui all moved to.
      - name: Install the test runner
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-nextest

      # the same commands the project is developed against
      - name: Formatting
        run: cargo fmt --all --check

      # --locked throughout: CI resolving a newer dependency than the one in
      # Cargo.lock would make it a different tree from the one being reviewed.
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo nextest run --all-targets --locked

      # The rustdoc lints are denied in Cargo.toml, so this is the step that
      # makes them fire: `cargo doc` is not part of anybody's edit loop, and a
      # doc link that names a moved item breaks nothing you would notice.
      # Once — the output is the same on both runners.
      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --locked

      # There are no doctests today — every fence in the crate is ```text, and
      # a diagram is not a test. This is here because neither of the two
      # commands above would run one if there were: `--all-targets` excludes
      # doctests, and nextest cannot run them at all. The first ```rust block
      # anybody writes would otherwise be checked by nothing.
      - name: Doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --locked

  # Not a gate. rust-toolchain.toml pins an exact compiler on purpose, and
  # that is the version the other jobs speak for — but a pin means the day
  # rustc or clippy changes under us is the day somebody raises it, months of
  # lints later. This job is that news arriving on time. It is allowed to
  # fail: a lint added in a compiler nobody is using yet is not a broken
  # pull request.
  stable:
    name: stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      # The one place a toolchain is named rather than taken from
      # rust-toolchain.toml — that file is what this job exists to look past.
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: stable

      - name: Lints
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo +stable test --all-targets --locked

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Prebuilt binaries. `cargo install` compiled both of these from source
      # on every run, which cost more than everything they check.
      - name: Install the auditors
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-machete,cargo-deny

      - name: Unused dependencies
        run: cargo machete

      # This used to be `cargo audit || true`, which reported advisories and
      # then passed regardless — including for an advisory that was ours. The
      # three that arrive through ratatui are now named in deny.toml with the
      # reason each one is tolerated, and anything that is not one of those
      # three fails the build. deny also checks the licences of the tree and
      # where its crates were fetched from, which audit never did.
      - name: Advisories, licences, sources
        run: cargo deny --locked check

  # What fraction of the crate the six hundred tests actually execute. Not a
  # target to raise — a floor to notice falling through. The number today is
  # 72.7% of lines, and the interesting part of the report is never the total:
  # it is that `github/source/gh.rs` has seven hundred uncovered lines in it
  # while `tui/` sits above 97%.
  #
  # No upload to a third party. The summary is printed into the job, which is
  # where anybody who wants it is already looking, and it keeps this workflow
  # free of a token belonging to somebody else's service.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage

      # Not in rust-toolchain.toml's components: it is ~20 MB that only this
      # job has any use for, and that file is what everybody who clones the
      # repository downloads.
      - name: Install the instrumentation
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The floor is set just under where the crate stands rather than at a
      # round number, so it fails when coverage drops rather than when it is
      # merely not improving. Raise it when the real number moves away.
      - name: Coverage
        run: |
          cargo llvm-cov nextest --all-targets --locked \
            --summary-only --fail-under-lines 70 \
            | tee "$GITHUB_STEP_SUMMARY"

  # Cargo.toml asks for `crossterm = "0.28"`, and the only version anybody
  # ever builds is whatever the lockfile resolved — so the lower bound is a
  # claim nothing checks. This is what checks it: resolve every direct
  # dependency to the oldest version its requirement allows, and compile.
  # A failure here means a version requirement is a version lower than the
  # code needs, which is a bug for whoever depends on this crate rather than
  # cloning it.
  minimal-versions:
    name: minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      # `-Z direct-minimal-versions` is a nightly cargo flag; the crate is
      # still compiled by the pinned toolchain. Nightly is here to resolve,
      # not to build.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: minimal-versions
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-hack,cargo-minimal-versions

      # `--direct` rather than the whole graph: the requirements this crate
      # writes are the ones it is answerable for. What ratatui asks of lru is
      # ratatui's business, and pinning it here would be reporting somebody
      # else's bug as ours.
      - name: Oldest allowed dependencies
        run: cargo minimal-versions check --direct --all-targets

  # Two checks that read files and run nothing, so they need no token at all.
  lint:
    name: spelling · workflows
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      # The comments here are prose and there are thirty thousand lines of
      # them. What the checker is allowed to be wrong about is in _typos.toml,
      # entry by entry.
      - name: Spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      # The linter for the files in this directory. It is what says the
      # actions above should be pinned to a commit, that a checkout leaves a
      # token behind, and that a job with no `permissions:` block gets more
      # than it needs — the three things this workflow was changed for.
      #
      # `advanced-security: false` prints the findings here instead of
      # uploading them to code scanning, which this repository does not have
      # switched on. That is also why the job can hold no permissions.
      - name: Workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
