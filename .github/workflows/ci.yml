name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `rustup toolchain install` step: rust-toolchain.toml names the
      # exact version and the components, and rustup installs it on the first
      # cargo call. Naming a channel here as well would only be a second
      # answer to the same question, free to disagree with the first.
      - uses: Swatinem/rust-cache@v2

      # the same three commands the project is developed against
      - name: Formatting
        run: cargo fmt --all --check

      # --locked throughout: CI resolving a newer dependency than the one in
      # Cargo.lock would make it a different tree from the one being reviewed.
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Prebuilt binaries. `cargo install` compiled both of these from source
      # on every run, which cost more than everything they check.
      - name: Install the auditors
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-audit

      - name: Unused dependencies
        run: cargo machete

      # advisories in the tree are reported but do not fail the build: most of
      # them arrive through ratatui and are not ours to fix
      - name: Advisories
        run: cargo audit || true
