name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # macOS is here because the releases page has an aarch64-apple-darwin
      # tarball on it. Building a binary for a platform nothing has ever run
      # the tests on is publishing a guess; crossterm is where the two
      # actually differ, and crossterm is most of what the event loop is.
      #
      # No Windows: nothing is built for it and neither program has been
      # designed against it, so a red tick there would be reporting a
      # platform that was never claimed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      # No `rustup toolchain install` step: rust-toolchain.toml names the
      # exact version and the components, and rustup installs it on the first
      # cargo call. Naming a channel here as well would only be a second
      # answer to the same question, free to disagree with the first.
      - uses: Swatinem/rust-cache@v2

      # the same three commands the project is developed against
      - name: Formatting
        run: cargo fmt --all --check

      # --locked throughout: CI resolving a newer dependency than the one in
      # Cargo.lock would make it a different tree from the one being reviewed.
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

      # The rustdoc lints are denied in Cargo.toml, so this is the step that
      # makes them fire: `cargo doc` is not part of anybody's edit loop, and a
      # doc link that names a moved item breaks nothing you would notice.
      # Once — the output is the same on both runners.
      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --locked

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Prebuilt binaries. `cargo install` compiled both of these from source
      # on every run, which cost more than everything they check.
      - name: Install the auditors
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny

      - name: Unused dependencies
        run: cargo machete

      # This used to be `cargo audit || true`, which reported advisories and
      # then passed regardless — including for an advisory that was ours. The
      # three that arrive through ratatui are now named in deny.toml with the
      # reason each one is tolerated, and anything that is not one of those
      # three fails the build. deny also checks the licences of the tree and
      # where its crates were fetched from, which audit never did.
      - name: Advisories, licences, sources
        run: cargo deny --locked check
