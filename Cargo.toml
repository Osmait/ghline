[package]
name = "github-tui"
version = "0.1.0"
edition = "2024"
description = "A GitHub TUI: repositories, issues, pull requests and Actions, over the gh CLI"
repository = "https://github.com/Osmait/github-tui"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["github", "tui", "terminal", "git", "diff"]
categories = ["command-line-utilities", "development-tools"]
# The version this is developed against, said a second time and for a second
# audience: `rust-toolchain.toml` installs it for whoever clones the repo,
# this tells cargo to refuse with a version number rather than with whatever
# syntax error an older compiler happens to reach first. Raise both together.
rust-version = "1.96"

# The design's fixture and the headless renders that draw it. Off by default,
# so the binary somebody downloads carries neither. Turned on for the test
# build by the dev-dependency on this crate below, which is how a feature is
# said to be for tests and nothing else.
[features]
demo = []

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
ratatui-core = "0.1.2"
serde_json = "1.0.151"
tui-markdown = { version = "0.3.9", default-features = false }
unicode-width = "0.2"

# Lints kept deliberately narrow: the goal is to catch real defects, not to
# fight the `as u16` casts that a cell-grid renderer is made of.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
# `pub` had drifted into meaning two different things: part of the crate's
# published surface, and reachable from the file next door. The second is a
# claim a private module cannot back — `pub fn draw` in `github::view::ui`
# was never callable from outside the crate, and reading it said otherwise.
# Twenty-four of them, all inside private trees. Written `pub(crate)` they
# say the true thing, and what is still `pub` afterwards is the API.
unreachable_pub = "warn"

# The crate is documented at a density that only holds if breaking it is an
# error. A link that names a moved item is a doc comment that lies, and it
# lies silently: `cargo doc` is not something anybody runs before a push, so
# CI runs it instead. All three of these are clean today.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
# Nothing panics: no `unwrap`, no `expect`, no bare `panic!`; tests opt out
# locally. Invariants are written as `debug_assert!`, which is a deliberate
# choice rather than the default one — a violated invariant here costs a
# wrong cell, and stopping costs a terminal left in raw mode with a queue of
# unsent comments in it. The one place that argued for a hard `assert!` was
# a note handed to an agent against the wrong file, and it turned out it
# could not fire from any input: what it guards is a later change, and a
# later change is made where `debug_assert!` fires anyway.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
# idiom nits that had real hits when the pedantic group was tried
use_self = "warn"
unnested_or_patterns = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

# What the tarballs on the releases page are built with. The defaults are
# tuned for rebuilding often, which is the opposite of what a binary someone
# downloads once wants: `lto = "fat"` and one codegen unit let the optimiser
# see across crate boundaries — most of the drawing path is ratatui's code
# called from ours — and `strip` drops debug symbols nobody on the other end
# can use. Optimised for speed rather than size: the recent work here has
# been about what each frame costs, and `opt-level = "z"` would give some of
# it back to save a download that LTO and stripping already halve.
#
# The cost is build time. `cargo build --release` gets slower; `cargo build`
# and `cargo test`, which is what you actually run, are untouched.
#
# `panic = "abort"` is deliberately not here. `Terminal_`'s `Drop` is what
# puts the terminal back, and aborting skips it — the panic hook covers the
# same ground, but that would leave two answers to "who restores?" with only
# one of them written down where the type is.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Neither of these is compiled into anything that ships.
[dev-dependencies]
# This crate, depending on itself, purely to turn `demo` on while the tests
# are built. Cargo unifies the features of a package with those its
# dev-dependencies ask for, so `cargo test` compiles the fixture in and
# `cargo build` does not.
github-tui = { path = ".", features = ["demo"] }
# The bench harness. divan rather than criterion: a tenth of the dependencies
# for what is wanted here, which is four numbers and a comparison against the
# last run.
divan = "0.1.21"
# Golden frames — see tests/frames.rs. Default features off: the point is to
# compare one string against another, and the rest of it is serde, yaml, ron,
# toml and a glob walker for snapshotting things that are not strings.
insta = { version = "1.48.0", default-features = false }
# Properties — see tests/props.rs. The three parsers take input nobody here
# wrote, and this generates the input nobody here thought of. Default features
# off: the ones dropped fork a process per case to survive a segfault, which is
# a thing to want from C bindings and not from a lexer. It found an infinite
# loop on its first run.
proptest = { version = "1.11.0", default-features = false, features = ["std", "handle-panics"] }

# `harness = false` because divan brings its own; without it, libtest runs
# first and finds no `#[test]` to run.
[[bench]]
name = "cost"
harness = false
