[package]
name = "github-tui"
version = "0.1.0"
edition = "2024"
description = "A GitHub TUI: repositories, issues, pull requests and Actions, over the gh CLI"
repository = "https://github.com/Osmait/github-tui"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
ratatui-core = "0.1.2"
serde_json = "1.0.151"
tui-markdown = { version = "0.3.9", default-features = false }
unicode-width = "0.2"

# Lints kept deliberately narrow: the goal is to catch real defects, not to
# fight the `as u16` casts that a cell-grid renderer is made of.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# Nothing panics: no `unwrap`, no `expect`, no bare `panic!`; tests opt out
# locally. Invariants are written as `debug_assert!`, which is a deliberate
# choice rather than the default one — a violated invariant here costs a
# wrong cell, and stopping costs a terminal left in raw mode with a queue of
# unsent comments in it. The one place that argued for a hard `assert!` was
# a note handed to an agent against the wrong file, and it turned out it
# could not fire from any input: what it guards is a later change, and a
# later change is made where `debug_assert!` fires anyway.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
# idiom nits that had real hits when the pedantic group was tried
use_self = "warn"
unnested_or_patterns = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
